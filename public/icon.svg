<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Brain shape -->
  <path d="M50 20 Q30 25 25 35 Q20 45 25 55 Q30 65 35 70 Q40 75 50 75 Q60 75 65 70 Q70 65 75 55 Q80 45 75 35 Q70 25 50 20 Z" fill="#3c66ff" stroke="#2042c4" stroke-width="2"/>
  
  <!-- Neural network lines -->
  <line x1="35" y1="45" x2="45" y2="50" stroke="#9b6bff" stroke-width="1.5" opacity="0.7"/>
  <line x1="55" y1="50" x2="65" y2="45" stroke="#9b6bff" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="60" x2="50" y2="65" stroke="#9b6bff" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="65" x2="60" y2="60" stroke="#9b6bff" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Neuron nodes -->
  <circle cx="35" cy="45" r="3" fill="#7fa2ff"/>
  <circle cx="45" cy="50" r="3" fill="#7fa2ff"/>
  <circle cx="55" cy="50" r="3" fill="#7fa2ff"/>
  <circle cx="65" cy="45" r="3" fill="#7fa2ff"/>
  <circle cx="40" cy="60" r="3" fill="#7fa2ff"/>
  <circle cx="50" cy="65" r="3" fill="#7fa2ff"/>
  <circle cx="60" cy="60" r="3" fill="#7fa2ff"/>
</svg>

